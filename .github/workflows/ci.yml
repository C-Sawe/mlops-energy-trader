name: CI

# Runs the same two suites CLAUDE.md §3 says to keep green. No network or
# database is needed by either (§3: a test that needs one is a regression).
# Also called by deploy.yml as a gate, so nothing ships with a red suite.
on:
  push:
    # main is tested by deploy.yml's gate instead, so it isn't run twice.
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest + NFR-06 import contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.0"
          pip install -r requirements.txt -c constraints.txt
      - name: pytest
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Production build compiles
        run: npm run build
